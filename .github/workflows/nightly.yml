name: nightly

# A rolling pre-release that tracks main: rebuilt on every push to main (so it
# never lags behind a merge), with a daily cron as a backstop and on-demand
# dispatch. The `nightly` release is updated in place each run (never deleted, so
# `update` never hits a 404) and its assets are refreshed to track the latest main.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily (backstop)
  workflow_dispatch:

# Same group across all three trigger types, so an overlapping run (a push
# landing mid-cron, or two rapid pushes) cancels the older run before its
# publish step can race the newer run's upload/delete-asset steps against
# the same rolling "nightly" release. cancel-in-progress is safe here: the
# publish step already tolerates being cut short at any point (that's just
# a job failure, no different from a network blip) since it uploads today's
# assets before deleting anything, and the next run's delete loop always
# reconciles the release back to a consistent state.
concurrency:
  group: nightly-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: tests (race)
        run: make race
      - name: build & package archives
        run: make archives VERSION="nightly-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
      - name: publish rolling nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Automated build from main — commit $(git rev-parse --short HEAD), $(date -u +%Y-%m-%d). Pre-release; not a stable version."

          # Move the rolling tag to this commit.
          git tag -f nightly
          git push -f origin refs/tags/nightly

          # Upsert a PUBLISHED prerelease — never delete it. The old flow deleted
          # then recreated, so a failed/partial recreate left either nothing (404)
          # or a half-written draft (also 404 for the anonymous update client).
          # Always forcing --draft=false self-heals a release stuck in draft.
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --draft=false --prerelease --title "Nightly build" --notes "$NOTES"
          else
            gh release create nightly --prerelease --target "$GITHUB_SHA" --title "Nightly build" --notes "$NOTES"
          fi

          # Replace the assets — but upload TODAY's first and only delete the
          # PREVIOUS run's afterward. Doing it the other way (delete-then-
          # upload, as this used to) leaves a window with no matching asset
          # for a platform at all: `update` matches a release asset by
          # filename SUFFIX (e.g. "_linux-arm64.tar.gz"), and a client that
          # polls during that window 404s outright — this is exactly the
          # failure reported live: "update" resolved a target version from
          # the release metadata, then 404'd fetching the one platform file
          # that hadn't been re-uploaded yet. Since today's names carry the
          # date+sha, they never collide with yesterday's (checksums.txt is
          # the one exception — --clobber overwrites it in place; a client
          # mid-download of the previous checksums.txt in that instant would
          # see a mismatch and retry, which is far cheaper than a hard 404 on
          # the binary itself).
          gh release upload nightly dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
          for a in $(gh release view nightly --json assets -q '.assets[].name'); do
            case "$a" in
              *"$(git rev-parse --short HEAD)"*|checksums.txt) continue ;; # keep today's
            esac
            gh release delete-asset nightly "$a" --yes
          done
